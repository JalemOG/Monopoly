name: Monopoly Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # 2. El entorno virtual
    runs-on: ubuntu-latest

    steps:

    - name: Checkout del código
      uses: actions/checkout@v4


    - name: Configurar Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven # Esto acelera las descargas de Maven en el futuro


    - name: Compilar con Maven
      run: mvn clean install -B
